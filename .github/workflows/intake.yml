name: Intake repositories
on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalog-writes
  cancel-in-progress: false
jobs:
  intake:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[Intake]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Import owner submission
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = issues ]; then
            python scripts/add_repositories.py --event "$GITHUB_EVENT_PATH"
          else
            python scripts/add_repositories.py
          fi
      - run: python scripts/validate_repositories.py
      - name: Commit catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog categories intake README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Import authorized repository URLs'
            git push
          fi
